name: Release
run-name: npm ${{ github.ref_name }}

# One flow, started by a stable release tag on a commit of main: validate and freeze, publish the GitHub Release, then npm.
on:
  push:
    tags:
      - 'v[0-9]+.[0-9]+.[0-9]+'

permissions:
  contents: read

concurrency:
  group: npm-publication
  cancel-in-progress: false

env:
  RELEASE_TAG: ${{ github.ref_name }}
  NODE_OPTIONS: ''

jobs:
  prepare:
    name: Validate and freeze
    if: github.repository == 'llblab/divlet' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - name: Check release ref before executing package scripts
        shell: bash
        run: |
          set -euo pipefail
          [[ "$RELEASE_TAG" =~ ^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$ ]]
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          test "$(git rev-parse "refs/tags/$RELEASE_TAG^{commit}")" = "$GITHUB_SHA"
          # Only code that reached main can be released; a tag on a side branch is refused before any package script runs.
          git merge-base --is-ancestor "$GITHUB_SHA" refs/remotes/origin/main
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - name: Install an isolated real Pi test host
        run: |
          npm install --prefix "$RUNNER_TEMP/pi-host" --no-audit --no-fund @earendil-works/pi-coding-agent@1.5.2
          echo "$RUNNER_TEMP/pi-host/node_modules/.bin" >> "$GITHUB_PATH"
      - name: Test with the publisher npm version
        run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - run: npm test
      - run: npm run test:browser:all
      - run: npm run build
      - name: Freeze archives without running pack hooks again
        run: node scripts/npm-release.mjs prepare "$RELEASE_TAG" "$RUNNER_TEMP/npm-candidate"
      - name: Test the exact frozen archives, including real Pi
        env:
          DIVLET_RELEASE_MANIFEST: ${{ runner.temp }}/npm-candidate/manifest.json
        run: npm run test:release:pi
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/npm-candidate/
          if-no-files-found: error
          retention-days: 90
      - name: Retain browser screenshots on validation failure
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: browser-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: artifacts/*.png
          if-no-files-found: ignore
          retention-days: 7

  github-release:
    name: Publish GitHub Release
    needs: prepare
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      # The text comes from this tag's own CHANGELOG.md section, which must already name the release. No npm credential or OIDC
      # token exists in this job, and nothing from the checkout is installed or built.
      - name: Create the release from the changelog, unless the tag already has one
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          if gh release view "$RELEASE_TAG" >/dev/null 2>&1; then
            echo "::notice::$RELEASE_TAG already has a GitHub Release; leaving it as it is."
            exit 0
          fi
          node scripts/release-notes.mjs notes "$RELEASE_TAG" > "$RUNNER_TEMP/release-notes.md"
          gh release create "$RELEASE_TAG" --verify-tag --title "$(node scripts/release-notes.mjs title "$RELEASE_TAG")" --notes-file "$RUNNER_TEMP/release-notes.md"

  publish:
    name: Publish npm
    needs: [prepare, github-release]
    environment: npm
    runs-on: ubuntu-24.04
    timeout-minutes: 60
    permissions:
      contents: read
      actions: read
      id-token: write
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          fetch-depth: 0
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - name: Use an OIDC-capable npm CLI
        run: npm install --global npm@11.19.0 --ignore-scripts --no-audit --no-fund
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/npm-candidate/
      # No checkout dependency installation, build or package lifecycle scripts receive an OIDC token.
      - name: Publish frozen web, core and adapters through OIDC
        env:
          GH_TOKEN: ${{ github.token }}
        run: node scripts/npm-release.mjs publish "$RELEASE_TAG" "$RUNNER_TEMP/npm-candidate"
      - name: Retain outcome even after partial failure
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: npm-outcome-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            ${{ runner.temp }}/npm-candidate/manifest.json
            ${{ runner.temp }}/npm-candidate/publication-progress.json
          if-no-files-found: ignore
          retention-days: 90

  verify:
    name: Verify registry installation
    needs: publish
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-node@249970729cb0ef3589644e2896645e5dc5ba9c38 # v6
        with:
          node-version: '22.19.0'
          package-manager-cache: false
      - run: npm ci --legacy-peer-deps --ignore-scripts
      - run: npx --no-install playwright install --with-deps chromium
      - name: Install an isolated real Pi test host
        run: |
          npm install --prefix "$RUNNER_TEMP/pi-host" --no-audit --no-fund @earendil-works/pi-coding-agent@1.5.2
          echo "$RUNNER_TEMP/pi-host/node_modules/.bin" >> "$GITHUB_PATH"
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093 # v4
        with:
          name: npm-candidate-${{ github.run_id }}
          path: ${{ runner.temp }}/npm-candidate/
      - name: Test registry-name installations against frozen integrity
        env:
          DIVLET_RELEASE_MANIFEST: ${{ runner.temp }}/npm-candidate/manifest.json
        run: node core/tests/release/install-smoke.mjs --registry --pi
